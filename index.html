<html lang="en" translate="no">
<head>
  <meta charset="UTF-8">

  <title>Training Passive Voice</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f0ebf8;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body translate="no" class="notranslate" oncontextmenu="return false;" oncopy="return false;" oncut="return false;">

  <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSd5huE4lWEMkkzd1hhgx2kx6gg7KYt3KFE2vFFc6f0FBZtoMw/viewform?embedded=true" width="640" height="6313" frameborder="0" marginheight="0" marginwidth="0">Завантаження…</iframe>

  <script>
    document.addEventListener('contextmenu', function(e) {
      e.preventDefault();
    });

    document.addEventListener('keydown', function(e) {
      if (
        e.key === 'F12' || 
        (e.ctrlKey && (e.key === 'c' || e.key === 'C' || e.key === 'u' || e.key === 'U' || e.key === 's' || e.key === 'S')) ||
        (e.metaKey && (e.key === 'c' || e.key === 'C' || e.key === 'u' || e.key === 'U' || e.key === 's' || e.key === 'S'))
      ) {
        e.preventDefault();
      }
    });
  </script>

</body>
